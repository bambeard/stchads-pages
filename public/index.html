<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>St Chad's Projects</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Times, "Times New Roman", Georgia, serif;
      font-size: 15px;
      line-height: 24px;
      color: #000;
      background: #fff;
    }

    a { color: #000; text-decoration: none; }
    a:hover { text-decoration: underline; }

    #page {
      position: relative;
      max-width: 960px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 40px 24px;
    }

    #logo {
      position: absolute;
      top: 40px;
      right: 24px;
    }

    #logo img {
      width: 96px;
      height: 96px;
      display: block;
    }

    #content {
      min-height: calc(100vh - 80px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 28px;
    }

    #names p { font-size: 20px; line-height: 30px; }

    #address a { display: block; }

    #contact p + p { margin-top: 6px; }

    /* Mobile */
    @media (max-width: 640px) {
      #logo { position: static; text-align: center; margin-bottom: 24px; }
      #content { min-height: auto; }
    }
  </style>
</head>
<body>
<div id="page">

  <div id="logo">
    <a href="https://www.instagram.com/stchadsprojects/" target="_blank" rel="noopener">
      <img src="https://www.stchadsprojects.com/images/bumprint2.jpg" alt="St Chad's" />
    </a>
  </div>

  <div id="content">
    <div id="names">
      <p>St Chad's Projects</p>
      <p>St Chad's Penton Rise</p>
    </div>

    <div id="address">
      <a href="https://goo.gl/maps/W4tXKJJZRyR8Xgb18" target="_blank" rel="noopener">
        51°31'45.9"N 0°07'05.3"W
      </a>
    </div>

    <div id="contact">
      <p><a href="https://www.instagram.com/stchadsprojects/" target="_blank" rel="noopener">@stchadsprojects</a></p>
      <p><a id="email-link" href="#">email</a></p>
    </div>
  </div>

</div>
<script>
  (function () {
    var user = "stchadsprojects";
    var host = "gmail.com";
    document.getElementById("email-link").href = "mailto:" + user + "@" + host;
  })();
</script>
</body>
</html>
